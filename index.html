<script>
(()=>{
const D=JSON.parse(document.getElementById('d').textContent), K='hub-schluessel';
const raw=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const bytes2b64=a=>btoa(String.fromCharCode(...a));
async function derive(pw){
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:raw(D.s),iterations:D.n,hash:'SHA-256'},k,256));
}
async function plain(key){
  const k=await crypto.subtle.importKey('raw',key,'AES-GCM',false,['decrypt']);
  const gz=await crypto.subtle.decrypt({name:'AES-GCM',iv:raw(D.i)},k,raw(D.c));
  return new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
}
function show(html){document.open();document.write(html);document.close();}
const f=document.getElementById('f'),e=document.getElementById('e'),b=document.getElementById('b');
const saved=localStorage.getItem(K);
if(saved){plain(raw(saved)).then(show,()=>localStorage.removeItem(K));}
f.addEventListener('submit',async ev=>{
  ev.preventDefault();b.disabled=true;e.textContent='';
  try{
    const key=await derive(document.getElementById('p').value.trim());
    const html=await plain(key);
    if(document.getElementById('m').checked)localStorage.setItem(K,bytes2b64(key));
    show(html);
  }catch(x){e.textContent='Passwort falsch.';b.disabled=false;}
});
})();
</script></body></html>
